        }

        @font-face {

        @font-face {

        #app-splash {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
            opacity: 1;
        }

        .splash-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .splash-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1;
        }

        .splash-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 1;
        }

            .splash-video.ready {
                opacity: 1;
            }

        #app-splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #splash-skip {
            position: absolute;
            bottom: 32px;
            right: 32px;
            z-index: 3;
            padding: 10px 22px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.35);
            color: white;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 200ms ease;
        }

            #splash-skip:hover {
                background: rgba(255, 255, 255, 0.2);
            }

        .splash-logo {
            position: relative;
            z-index: 2;
            max-width: 260px;
            width: 60%;
            height: auto;
            object-fit: contain;
            opacity: 1;
            transform: translateY(12px);
        }
    </style>

<body>
    <div id="app" class="h-screen w-full p-0 m-0 min-h-1"></div>

    <!-- Splash screen -->
    <div id="app-splash">
        <!-- <video id="splash-video"
                class="splash-video"
                poster="img/intro.jpg"
                autoplay
                muted
                playsinline
                preload="auto">
             <source src="videos/intro.mp4" type="video/mp4" />
         </video>-->

        <img class="splash-video" src="img/intro.jpg" alt="НаемZZ" />

        <div class="splash-overlay"></div>

        <img class="splash-logo" src="img/logo.png" alt="НаемZZ" />

        <!-- <button id="splash-skip"
                 type="button"
                 onclick="window.appSplash.skip()">
             Пропусни <span aria-hidden="true">→</span>
         </button>-->
    </div>

    <div id="blazor-error-ui">
        Възникна неочаквана грешка.
        <a href="" class="reload">Презареди</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
                 window.appSplash = {
             startedAt: Date.now(),

             hide: async function () {
                 const elapsed = Date.now() - this.startedAt;
                 const remaining = Math.max(0, 3000 - elapsed);

                 if (remaining > 0) {
                     await new Promise(resolve => setTimeout(resolve, remaining));
                 }

                 const splash = document.getElementById("app-splash");

                 if (splash) {
                     splash.classList.add("hidden");

                     setTimeout(() => splash.remove(), 350);
                 }
             }
         };
    </script>
    <script src="_framework/blazor.webview.js"></script>
</body>
